<!doctype html>
<html lang='en'>
  <head>
    <title>Log in - To Do List</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='Log in with GitHub to manage your to do list.' />

    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap' rel='stylesheet' />

    <link rel='stylesheet' href='css/main.css' />

    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main>
      <section id='panel'>
        <h1>To Do List</h1>

        <p id='login-text'>
          Log in with your GitHub account to see your tasks.
          If this is your first time, a new account will be created for you.
        </p>

        <a href='/auth/github' id='login-button'>Log in with GitHub</a>
      </section>
    </main>
  </body>
</html>
