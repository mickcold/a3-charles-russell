<!doctype html>
<html lang='en'>
  <head>
    <title>Log in - To Do List</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='Log in with GitHub to manage your to do list.' />

    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css' />
    <link rel='stylesheet' href='css/main.css' />

    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main class='container'>
      <article>
        <header>
          <h1>To Do List</h1>
        </header>

        <p>
          Log in with your GitHub account to see your tasks.
          If this is your first time, a new account will be created for you.
        </p>

        <a href='/auth/github' role='button'>Log in with GitHub</a>
      </article>
    </main>
  </body>
</html>
