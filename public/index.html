<!doctype html>
<html lang='en'>
  <head>
    <title>To Do List - A3</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />

    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap' rel='stylesheet' />

    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />

    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main>
      <section id='panel'>

        <div id='panel-header'>
          <h1>To Do List</h1>
          <button type='button' id='add-button' aria-label='Add a task' aria-expanded='false'>
            <span id='add-glyph' aria-hidden='true'>+</span>
          </button>
        </div>

        <div id='list-container'>

          <form id='todo-form' hidden>
            <div class='field'>
              <label for='task'>Task</label>
              <input type='text' id='task' name='task' maxlength='80' required />
            </div>

            <div class='field-row'>
              <div class='field'>
                <label for='created-date'>Created</label>
                <input type='date' id='created-date' name='created_date' />
              </div>

              <div class='field'>
                <label for='due-date'>Due</label>
                <input type='date' id='due-date' name='due_date' required />
              </div>
            </div>

            <div class='field-actions'>
              <button type='submit' id='submit-button'>Add task</button>
              <button type='button' id='cancel-button' class='secondary'>Cancel</button>
            </div>
          </form>

          <ul id='todo-list'></ul>

          <p id='empty-message'>No tasks yet.</p>

        </div>

        <p id='status' role='status'></p>

      </section>
    </main>
  </body>
</html>
